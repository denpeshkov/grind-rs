# Dependabot configuration:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # GitHub Actions dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group routine patch and minor updates into one PR.
    groups:
      github-actions-dependencies:
        update-types:
          - "patch"
          - "minor"
    # Limit the number of open version update PRs.
    open-pull-requests-limit: 3

  # Cargo dependencies.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # This is a library; consumers resolve dependencies with their own lockfile.
    # Remove this if the package also builds binaries.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    # Limit the number of open version update PRs.
    open-pull-requests-limit: 3
